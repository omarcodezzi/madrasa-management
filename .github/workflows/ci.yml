name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET build, tests, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror:CS8602,CS8618
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"
      - name: Model and migrations are in sync
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes -p src/Madrasa.Infrastructure -s src/Madrasa.Infrastructure --no-build --configuration Release
      - name: Vulnerable NuGet packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q -E "Critical|High" vuln.txt

  frontend:
    name: Frontend (Angular build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: English text for every screen and API message
        run: node tools/i18n-check.mjs
      - run: npx ng build
      - run: npx ng test --watch=false
      - name: Vulnerable npm packages (production)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t madrasa-api ./backend
