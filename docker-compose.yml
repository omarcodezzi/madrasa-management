# Local development: SQL Server + API. Run the Angular app with `npm start` in frontend/.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports: ["1433:1433"]
    volumes: [mssql:/var/opt/mssql]

  api:
    build: ./backend
    depends_on: [db]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Server=db,1433;Database=MMS;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True
      Jwt__Key: ${JWT_KEY}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
    ports: ["5080:8080"]
    restart: on-failure

volumes:
  mssql:
